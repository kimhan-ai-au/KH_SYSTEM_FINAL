name: KH-EMERGENCY-FIX-V4

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: CHECKOUT_V4
        uses: actions/checkout@v4

      - name: SETUP_JAVA_V4
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: PERMISSION_GRANT
        run: chmod +x gradlew

      - name: BUILD_AAB
        run: ./gradlew bundleRelease

      - name: UPLOAD_ARTIFACT_V4_FINAL
        uses: actions/upload-artifact@v4 # 여기서 v3를 쓰면 무조건 에러가 납니다. 반드시 v4 확인.
        with:
          name: KIMHAN-100-AI-FINAL
          path: app/build/outputs/bundle/release/*.aab
