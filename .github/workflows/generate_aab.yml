name: KH-AI-AAB-GENERATOR-PRO

on:
  workflow_dispatch: # 지휘관님의 수동 실행 신호

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 설계도(Source) 로딩
        uses: actions/checkout@v4

      - name: 2. 지능 배양 환경(JDK 17) 구축
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 3. 빌드 권한 부여
        run: chmod +x gradlew

      - name: 4. AAB 물리적 이식 (Release Build)
        run: ./gradlew bundleRelease

      - name: 5. 완성된 지능 자산(.aab) 추출 (v4 적용)
        uses: actions/upload-artifact@v4 # v3에서 v4로 긴급 교체 완료
        with:
          name: KIMHAN-100-AI-Bundle
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error # 파일 미생성 시 즉각 보고
