name: KH-SOVEREIGN-AAB-COMPLETER-V4

on:
  workflow_dispatch: # 지휘관님이 수동으로 실행 버튼을 누를 때 발동

jobs:
  perfect-build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 설계도 로딩 (Checkout v4)
        uses: actions/checkout@v4

      - name: 2. 지능 배양 환경 구축 (JDK 17)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 3. 실행 권한 부여 및 환경 정리
        run: |
          chmod +x gradlew
          ./gradlew clean

      - name: 4. AAB 물리적 이식 (최종 번들 생성)
        run: ./gradlew bundleRelease --stacktrace

      - name: 5. 완결된 지능 자산(.aab) 추출 (Upload v4)
        uses: actions/upload-artifact@v4
        with:
          name: KIMHAN-100-AI-FINAL
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error # 파일이 없을 경우 즉시 보고
