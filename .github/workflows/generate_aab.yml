name: KH-AI-AAB-FINAL-SUCCESS

on:
  workflow_dispatch: # 지휘관님이 수동으로 [Run workflow]를 누를 때 실행

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 설계도 로딩 (v4 적용)
        uses: actions/checkout@v4

      - name: 2. 자바 환경 구축 (v4 적용)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 3. 실행 권한 강제 부여
        run: chmod +x gradlew

      - name: 4. AAB 파일 물리적 이식
        run: ./gradlew bundleRelease

      - name: 5. 파일 추출 (v4로 최종 해결)
        uses: actions/upload-artifact@v4
        with:
          name: KIMHAN-100-AI-Bundle
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error # 파일이 없을 경우 즉시 에러 보고
