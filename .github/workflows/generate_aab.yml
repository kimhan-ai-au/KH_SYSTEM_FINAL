name: KH-AI-AAB-FINAL-FIX

on:
  workflow_dispatch: # 지휘관님이 실행 버튼을 누를 때 작동

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 설계도 로딩
        uses: actions/checkout@v4 # 최신 버전 v4로 교정

      - name: 2. 자바 환경 구축
        uses: actions/setup-java@v4 # 최신 버전 v4로 교정
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. 실행 권한 부여
        run: chmod +x gradlew

      - name: 4. AAB 파일 생성
        run: ./gradlew bundleRelease

      - name: 5. 파일 추출 (최종 해결)
        uses: actions/upload-artifact@v4 # 오류의 원인이었던 v3를 v4로 완벽 교정
        with:
          name: KIMHAN-100-AI-Bundle
          path: app/build/outputs/bundle/release/*.aab
